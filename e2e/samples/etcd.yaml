apiVersion: apps/v1
kind: Deployment
metadata:
  name: etcd
  namespace: gw
spec:
  replicas: 1
  selector:
    matchLabels: { app: etcd }
  template:
    metadata:
      labels: { app: etcd }
    spec:
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.17
          command:
            - etcd
            - --name=etcd
            - --data-dir=/tmp/etcd
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://etcd.gw.svc:2379
          ports:
            - containerPort: 2379
          readinessProbe:
            tcpSocket: { port: 2379 }
          volumeMounts:
            - { name: data, mountPath: /tmp/etcd }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: gw
spec:
  selector: { app: etcd }
  ports:
    - { name: client, port: 2379, targetPort: 2379 }
