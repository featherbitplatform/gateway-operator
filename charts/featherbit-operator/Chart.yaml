sources:
  - https://github.com/featherbitplatform/gateway-operator
  - https://github.com/featherbitplatform/gateway
keywords:
  - api-gateway
  - operator
  - crd
  - rust
maintainers:
  - name: featherbit
    url: https://github.com/featherbitplatform
annotations:
