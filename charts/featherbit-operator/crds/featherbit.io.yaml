    - jsonPath: .status.conditions[?(@.type=="Programmed")].status
      name: Programmed
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            description: |-
              A reusable named subgraph with a boundary of one `input`, one or more
              `output`, and one or more `error` pseudo-nodes; each output/error node's
              id is an instance port name (`output` = the `success` port; `error` =
              the default error port) (declared in `nodes` like a policy declares
              `listener`/`client`, so the UI can persist positions).

              Instances appear in policies as nodes of `type: supernode` with
              `config: { name: <this name> }` and are inlined at compile time —
              stored configuration always keeps the compact reference form.
            properties:
              description:
                description: Optional human-readable description (shown in the UI library).
                nullable: true
                type: string
              edges:
                default: []
                description: |-
                  Directed connections; boundary edges use `input.out`, `output.in`,
                  `error.in` endpoints.
                items:
                  description: |-
                    A directed edge between two node ports, written as `node_id.port`.

                    Ports: `out`, `success`, `error` on the source side; `in` on the target
                    side (e.g. `from: auth.success`, `to: upstream.in`).
                  properties:
                    from:
                      description: Source endpoint, `node_id.port`.
                      type: string
                    to:
                      description: Target endpoint, `node_id.port`.
                      type: string
                  required:
                  - from
                  - to
                  type: object
                type: array
              nodes:
                default: []
                description: |-
                  Inner plugin nodes plus the boundary pseudo-nodes: one `input`, one
                  or more `output`, and one or more `error` pseudo-nodes; each
                  output/error node's id is an instance port name (`output` = the
                  `success` port; `error` = the default error port).
                items:
                  description: One plugin node in a policy graph.
                  properties:
                    config:
                      additionalProperties: true
                      default: {}
                      description: Free-form plugin-specific configuration; defaults to empty.
                      type: object
                    config_ref:
                      description: |-
                        Optional name of a shared [`PluginConfigDef`] to inherit configuration
                        from. The effective config is the shared config with this node's own
                        `config` keys layered on top (shallow merge, local wins), materialized
                        at compile time — the stored form always keeps the reference.
                      nullable: true
                      type: string
                    id:
                      description: Unique node id within the policy, referenced by edges as `id.port`.
                      type: string
                    position:
                      description: |-
                        Canvas coordinates for the Web UI node editor; ignored by the engine
                        and omitted from serialized output when unset.
                      nullable: true
                      properties:
                        x:
                          format: double
                          type: number
                        y:
                          format: double
                          type: number
                      required:
                      - x
                      - y
                      type: object
                    type:
                      description: |-
                        Plugin type (YAML key: `type`), e.g. `upstream`, `key-auth`, `script`;
                        must be one of the registered plugin types.
                      type: string
                  required:
                  - id
                  - type
                  type: object
                type: array
            title: SupernodeConfig
            type: object
          status:
            description: Status of the six resource kinds.
            properties:
              conditions:
                default: []
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              gateways:
                default: []
                description: Gateways whose rendered config includes this object.
                items:
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                type: array
              observedGeneration:
                format: int64
                nullable: true
                type: integer
            title: ResourceStatus
            type: object
        required:
        - spec
        title: Supernode
        type: object
    served: true
    storage: true
    subresources:
      status: {}
