---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: routes.featherbit.io
spec:
  group: featherbit.io
  names:
    categories:
    - featherbit
    kind: Route
    plural: routes
    shortNames:
    - fbroute
    singular: route
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.policy
      name: Policy
      type: string
    - jsonPath: .spec.match.path
      name: Path
      type: string
    - jsonPath: .status.conditions[?(@.type=="Accepted")].status
      name: Accepted
      type: string
    - jsonPath: .status.conditions[?(@.type=="Programmed")].status
      name: Programmed
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            description: Binds a request match rule to a named policy.
            properties:
              match:
                description: 'Conditions a request must satisfy (YAML key: `match`).'
                properties:
                  headers:
                    additionalProperties:
                      type: string
                    default: {}
                    description: Required header name → value pairs; empty means no header constraints.
                    type: object
                  host:
                    description: |-
                      Required `Host` value; `None` matches any host. Exact hostname or a
                      single-label wildcard (`*.example.com`); the request's port is ignored.
                      Merged with [`hosts`](Self::hosts) at match time.
                    nullable: true
                    type: string
                  hosts:
                    description: |-
                      Additional accepted `Host` patterns (same syntax as `host`); the route
                      matches when any entry matches. Empty means no constraint beyond `host`.
                    items:
                      type: string
                    type: array
                  methods:
                    default: []
                    description: Allowed HTTP methods; empty means any method.
                    items:
                      type: string
                    type: array
                  path:
                    description: Path pattern to match (e.g. `/api/*`); `None` matches any path.
                    nullable: true
                    type: string
                type: object
              policy:
                description: Name of the [`PolicyConfig`] to execute; must exist or compilation fails.
                type: string
            required:
            - match
            - policy
            title: RouteConfig
            type: object
          status:
            description: Status of the six resource kinds.
            properties:
              conditions:
                default: []
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              gateways:
                default: []
                description: Gateways whose rendered config includes this object.
                items:
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                type: array
              observedGeneration:
                format: int64
                nullable: true
                type: integer
            title: ResourceStatus
            type: object
        required:
        - spec
        title: Route
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: policies.featherbit.io
spec:
  group: featherbit.io
  names:
    categories:
    - featherbit
    kind: Policy
    plural: policies
    shortNames:
    - fbpolicy
    singular: policy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Accepted")].status
      name: Accepted
      type: string
    - jsonPath: .status.conditions[?(@.type=="Programmed")].status
      name: Programmed
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            description: |-
              A node-graph policy: a named pipeline of plugin nodes wired by edges.

              Compiled into a `CompiledGraph` at load/reload time; execution starts at
              the `listener` node and follows each node's `success`/`error` ports.
            properties:
              edges:
                default: []
                description: Directed connections between node ports.
                items:
                  description: |-
                    A directed edge between two node ports, written as `node_id.port`.

                    Ports: `out`, `success`, `error` on the source side; `in` on the target
                    side (e.g. `from: auth.success`, `to: upstream.in`).
                  properties:
                    from:
                      description: Source endpoint, `node_id.port`.
                      type: string
                    to:
                      description: Target endpoint, `node_id.port`.
                      type: string
                  required:
                  - from
                  - to
                  type: object
                type: array
              error_handler:
                description: Optional id of a node to jump to when a node errors without an explicit error edge.
                nullable: true
                type: string
              nodes:
                default: []
                description: Plugin nodes making up the pipeline.
                items:
                  description: One plugin node in a policy graph.
                  properties:
                    config:
                      additionalProperties: true
                      default: {}
                      description: Free-form plugin-specific configuration; defaults to empty.
                      type: object
                    config_ref:
                      description: |-
                        Optional name of a shared [`PluginConfigDef`] to inherit configuration
                        from. The effective config is the shared config with this node's own
                        `config` keys layered on top (shallow merge, local wins), materialized
                        at compile time — the stored form always keeps the reference.
                      nullable: true
                      type: string
                    id:
                      description: Unique node id within the policy, referenced by edges as `id.port`.
                      type: string
                    position:
                      description: |-
                        Canvas coordinates for the Web UI node editor; ignored by the engine
                        and omitted from serialized output when unset.
                      nullable: true
                      properties:
                        x:
                          format: double
                          type: number
                        y:
                          format: double
                          type: number
                      required:
                      - x
                      - y
                      type: object
                    type:
                      description: |-
                        Plugin type (YAML key: `type`), e.g. `upstream`, `key-auth`, `script`;
                        must be one of the registered plugin types.
                      type: string
                  required:
                  - id
                  - type
                  type: object
                type: array
            title: PolicyConfig
            type: object
          status:
            description: Status of the six resource kinds.
            properties:
              conditions:
                default: []
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              gateways:
                default: []
                description: Gateways whose rendered config includes this object.
                items:
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                type: array
              observedGeneration:
                format: int64
                nullable: true
                type: integer
            title: ResourceStatus
            type: object
        required:
        - spec
        title: Policy
        type: object
    served: true
    storage: true
    subresources:
      status: {}
