apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: consumers.featherbit.io
spec:
  group: featherbit.io
  names:
    categories:
    - featherbit
    kind: Consumer
    plural: consumers
    shortNames:
    - fbconsumer
    singular: consumer
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Accepted")].status
