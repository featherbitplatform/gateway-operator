  name: supernodes.featherbit.io
spec:
  group: featherbit.io
  names:
    categories:
    - featherbit
    kind: Supernode
    plural: supernodes
    shortNames:
    - fbsupernode
    singular: supernode
  scope: Namespaced
  versions:
