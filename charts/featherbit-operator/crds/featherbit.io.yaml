              A consumer as declared in `gateway.yaml` under `consumers:`.

              ```yaml
              consumers:
                - name: alice
                  group: partners
                  labels: { custom_id: "42", tier: gold }
                  credentials:
                    key-auth: { key: "s3cret" }
                    basic-auth: { username: alice, password: pw }
              ```
            properties:
              credentials:
                additionalProperties: true
                default: {}
                description: |-
                  Per-auth-plugin credentials, keyed by plugin type
