apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: stores.featherbit.io
spec:
  group: featherbit.io
  names:
    categories:
    - featherbit
    kind: Store
    plural: stores
    shortNames:
    - fbstore
    singular: store
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Accepted")].status
      name: Accepted
      type: string
    - jsonPath: .status.conditions[?(@.type=="Programmed")].status
      name: Programmed
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            description: |-
              A named shared store: a redis/valkey connection referenced by name from
              plugin config. Declared under top-level `stores:`. `url` and `password`
              support `${ENV_VAR:-default}` placeholders, resolved only when the client
              is built — the stored config (and everything the Admin API serves) keeps
              the raw placeholder.
            properties:
              connect_budget_ms:
                default: 5000
                description: |-
                  Total budget for establishing the first connection, covering every
                  retry and the backoff between them.

                  `connect_timeout_ms` bounds one attempt only, so without this the
                  connection manager's retry schedule decides how long a request waits
                  on an unreachable store -- tens of seconds with the crate defaults, on
                  the first request after an outage begins. A failed connect is not
                  cached, so the next request tries again.
                format: uint64
                minimum: 0.0
                type: integer
              connect_timeout_ms:
                default: 2000
                description: |-
                  Connect/response timeout applied to the client and to `ping`. Bounds a
                  single attempt; see `connect_budget_ms` for the total.
                format: uint64
                minimum: 0.0
                type: integer
              description:
                description: Optional human-readable description (shown in the UI library).
                nullable: true
                type: string
              key_prefix:
                default: fb
                description: Namespace prefix for every key this store writes.
                type: string
              password:
                description: Optional password; overrides any password embedded in `url`.
                nullable: true
                type: string
              tls:
                description: TLS options for a `rediss://` store.
                nullable: true
                properties:
                  ca_cert_path:
                    description: PEM CA bundle for a private CA.
                    nullable: true
                    type: string
                type: object
              topology:
                description: |-
                  Reserved for HA topologies (`sentinel`/`cluster`); v1 accepts only
                  `standalone` (the default) and rejects anything else at config load.
                nullable: true
                type: string
              type:
                description: |-
                  Backend type (YAML key: `type`): `redis` or `valkey` — aliases for the
                  same RESP backend.
                type: string
              url:
                description: Connection URL (`redis://` or `rediss://`).
                type: string
              urls:
                description: |-
                  Reserved for HA topologies (sentinel/cluster endpoint lists); rejected
                  at config load in v1.
                items:
                  type: string
                nullable: true
                type: array
            required:
            - type
            - url
            title: StoreConfig
            type: object
          status:
            description: Status of the six resource kinds.
            properties:
              conditions:
                default: []
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              gateways:
                default: []
                description: Gateways whose rendered config includes this object.
                items:
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                type: array
              observedGeneration:
