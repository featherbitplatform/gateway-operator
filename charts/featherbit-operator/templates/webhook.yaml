{{- $kinds := dict "Route" "routes" "Policy" "policies" "Supernode" "supernodes" "PluginConfig" "pluginconfigs" "Store" "stores" "Consumer" "consumers" "FeatherbitGateway" "featherbitgateways" }}
{{- $svc := include "featherbit-operator.webhookServiceName" . }}
{{- $caBundle := "" }}
{{- if not .Values.webhook.certManager.enabled }}
{{- $caBundle = (include "featherbit-operator.webhookCA" . | fromJson).ca }}
{{- end }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "featherbit-operator.fullname" . }}
  labels:
    {{- include "featherbit-operator.labels" . | nindent 4 }}
  {{- if .Values.webhook.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "featherbit-operator.fullname" . }}-webhook
  {{- end }}
webhooks:
  {{- range $kind := keys $kinds | sortAlpha }}
  {{- $plural := get $kinds $kind }}
  - name: {{ lower $kind }}.featherbit.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    matchPolicy: Equivalent
    failurePolicy: {{ $.Values.webhook.failurePolicy }}
    timeoutSeconds: {{ $.Values.webhook.timeoutSeconds }}
    rules:
      - apiGroups: ["featherbit.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: [{{ $plural | quote }}]
        scope: Namespaced
    clientConfig:
      {{- if not $.Values.webhook.certManager.enabled }}
      caBundle: {{ $caBundle }}
      {{- end }}
      service:
        name: {{ $svc }}
        namespace: {{ $.Release.Namespace }}
        path: /validate/featherbit.io/v1alpha1/{{ $kind }}
        port: 443
  {{- end }}
