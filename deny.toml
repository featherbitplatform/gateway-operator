# cargo-deny configuration — dependency advisories, licenses, bans, sources.
# Run locally via `dev/sast.sh deny` (or `cargo deny check`); CI runs the same
# config through EmbarkStudios/cargo-deny-action in .github/workflows/security.yml.

[graph]
all-features = true

[advisories]
# RustSec advisory DB. Errors fail the scan; unmaintained/unsound advisories
# surface as warnings.
yanked = "deny"
ignore = [
    # smartstring is unmaintained (repo archived 2026-05-03); pulled in via the
    # featherbit gateway crate -> casbin -> rhai. No safe upgrade exists;
    # revisit when the gateway moves off it.
    "RUSTSEC-2026-0249",
    # rustls-pemfile is unmaintained (archived 2025-08); pulled in via
    # axum-server 0.7 (our TLS listener). Revisit when axum-server drops it.
    "RUSTSEC-2025-0134",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "MIT-0",
    "CC0-1.0",
    # Boost Software License (permissive, OSI-approved): xxhash-rust.
    "BSL-1.0",
]
# This crate is publish = false; don't require a license expression on it.
private = { ignore = true }

# ring ships a composite LICENSE file rather than an SPDX expression; this is
# the community-standard clarification for it.
[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Duplicate crate versions surface as warnings so NEW dupes stay visible.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/featherbitplatform/gateway"]
