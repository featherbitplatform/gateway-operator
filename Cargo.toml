[package]
name = "featherbit-operator"
version = "0.1.0"
edition = "2021"
publish = false
description = "Kubernetes operator for the featherbit API gateway"
license = "Apache-2.0"

[dependencies]
# Pins the gateway release tag; bump at each gateway release (the gateway's
# tests/lib_surface.rs pins the surface this crate links).
featherbit = { version = "0.16", git = "https://github.com/featherbitplatform/gateway", tag = "v0.16.0", default-features = false, features = ["redis-store"] }

kube = { version = "4", default-features = false, features = ["client", "runtime", "derive", "admission", "rustls-tls"] }
k8s-openapi = { version = "0.28", features = ["latest", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
prometheus = "0.14"
sha2 = "0.11"
hex = "0.4"
thiserror = "2"
anyhow = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["test-util"] }

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
