version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      kube:
        patterns: ["kube*", "k8s-openapi"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
