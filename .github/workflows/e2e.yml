# kind end-to-end: operator + gateway chart, ConfigMap and etcd sinks, webhook
# rejection and partial render. Needs the gateway chart from develop (it has
# config.gatewayConfigMap; the released 0.15.0 does not).
name: e2e

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # The script installs the published gateway chart (oci://ghcr.io/featherbitplatform/charts/
      # featherbit-gateway, version pinned in e2e/run.sh). To test an unreleased gateway chart, check
      # out featherbitplatform/gateway here and set GATEWAY_CHART to its charts/featherbit-gateway path.
      KEEP_CLUSTER: "1"   # the runner is discarded; keeps the cluster for the failure collection step
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      # Installs the kind binary only; e2e/run.sh creates and deletes the cluster.
      - uses: helm/kind-action@v1
        with:
          install_only: true

      - uses: docker/setup-buildx-action@v3

      - name: e2e
        run: bash e2e/run.sh

      - name: Collect cluster state
        if: failure()
        run: |
          kubectl -n gw get all -o yaml > gw-all.yaml || true
          kubectl get routes,policies,featherbitgateways -A -o yaml > gw-gateways.yaml || true
          kubectl -n gw get configmaps -l app.kubernetes.io/managed-by=featherbit-operator -o yaml > gw-rendered.yaml || true
          kubectl -n gw logs deploy/op-featherbit-operator --tail=500 > operator.log || true
          kubectl -n gw logs -l app.kubernetes.io/name=featherbit-gateway --all-containers --tail=300 --prefix > gateway.log || true

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: e2e-diagnostics
          path: |
            err.txt
            gw-all.yaml
            gw-gateways.yaml
            gw-rendered.yaml
            operator.log
            gateway.log
          if-no-files-found: ignore
