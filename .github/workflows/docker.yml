# Multi-arch Docker image to Docker Hub.
#
#   vX.Y.Z tag   -> X.Y.Z, X.Y
#   develop push -> edge
#   main push    -> only syncs the Docker Hub description (DOCKERHUB.md)
#
# Each platform builds natively on its own runner (ubuntu-24.04 /
# ubuntu-24.04-arm; no QEMU: fat-LTO builds under emulation would blow the job
# limit) and pushes by digest only; `merge` stitches the digests into one
# multi-arch manifest and applies the tags. Per-platform attestations are off
# (merging attestation indexes into a manifest list is unreliable); the image
# SBOM is generated by syft from the merged manifest instead.
name: docker

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: docker.io/${{ secrets.DOCKER_USERNAME }}/operator

jobs:
  build:
    name: build (${{ matrix.platform }})
    if: github.ref != 'refs/heads/main'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # "linux/amd64" -> "linux-amd64" for artifact names and cache scopes.
      - name: Prepare platform slug
        run: |
          platform='${{ matrix.platform }}'
          echo "PLATFORM_SLUG=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-${{ env.PLATFORM_SLUG }}
          cache-to: type=gha,scope=docker-${{ env.PLATFORM_SLUG }},mode=max

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_SLUG }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge manifest
    runs-on: ubuntu-24.04
    needs: build
    steps:
      # Pinned to a patched release (the floating v4 tag trips grype).
      - uses: actions/download-artifact@v4.3.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/develop' }}

      # A dispatch on an arbitrary branch, or a glob-matching non-semver tag,
      # computes zero tags: fail here instead of after pushing digests.
      - name: Guard against empty tag list
        if: steps.meta.outputs.tags == ''
        env:
          GH_REF: ${{ github.ref }}
        run: |
          echo "::error::No Docker tags computed for $GH_REF - nothing to publish."
          exit 1

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect manifest
        run: docker buildx imagetools inspect "$(head -n1 <<< "$DOCKER_METADATA_OUTPUT_TAGS")"

  # CycloneDX SBOMs: the crate (cargo-cyclonedx) and the published image
  # (syft, from the merged manifest; the FROM scratch filesystem is inventoried
  # through the crate list cargo-auditable embeds). Uploaded as workflow
  # artifacts on every publish, attached to the release on v* tags.
  sbom:
    name: sbom
    runs-on: ubuntu-24.04
    needs: merge
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        env:
          GH_REF: ${{ github.ref }}
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$GH_REF" == refs/tags/v* ]]; then
            echo "version=${GH_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "image_tag=${GH_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=edge" >> "$GITHUB_OUTPUT"
            echo "image_tag=edge" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0

      - uses: dtolnay/rust-toolchain@stable

      - name: Generate SBOMs
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          IMAGE_TAG: ${{ steps.ver.outputs.image_tag }}
        run: |
          mkdir -p sbom
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --override-filename featherbit-operator.cdx --all
          mv featherbit-operator.cdx.json "sbom/featherbit-operator-${VERSION}.cdx.json"
          "${{ steps.syft.outputs.cmd }}" scan "registry:${IMAGE}:${IMAGE_TAG}" --platform linux/amd64 \
            --source-name featherbit-operator-image --source-version "$VERSION" \
            -o "cyclonedx-json=sbom/featherbit-operator-image-${VERSION}.cdx.json"

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/

      # Creates the release for the tag if none exists yet.
      - name: Attach SBOMs to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: sbom/*.cdx.json

  readme-sync:
    name: sync Docker Hub description
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Needs DOCKER_PASSWORD to be an account password or adequately scoped
      # PAT; with a restricted access token this job fails while images still
      # publish. Fix = rotate the secret.
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ secrets.DOCKER_USERNAME }}/operator
          readme-filepath: ./DOCKERHUB.md
          short-description: Kubernetes operator for the featherbit API gateway
